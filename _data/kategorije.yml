# Popis kategorija portala Gorski Kotar Info.
# Novu kategoriju dodaj ovdje (name = točan naziv koji se piše u front matter, slug = sidro/filter bez dijakritika).
# U članku koristi:
#   location: Delnice
#   type: Crna kronika
#   categories: [Delnice, Crna kronika]

lokacije:
  - name: Delnice
    slug: delnice
  - name: Fužine
    slug: fuzine
  - name: Lokve
    slug: lokve
  - name: Mrkopalj
    slug: mrkopalj
  - name: Čabar
    slug: cabar
  - name: Skrad
    slug: skrad
  - name: Ravna Gora
    slug: ravna-gora
  # dodatne lokacije
  - name: Vrbovsko
    slug: vrbovsko
  - name: Gorski kotar
    slug: gorski-kotar

vrste:
  - name: Događanja
    slug: dogadanja
  - name: Crna kronika
    slug: crna-kronika
  - name: Sport
    slug: sport
  - name: Priroda
    slug: priroda
  - name: Promet
    slug: promet
  - name: Kultura
    slug: kultura
  - name: Zanimljivosti
    slug: zanimljivosti
  - name: Povijest
    slug: povijest
  # natječaji, javni pozivi, savjetovanja, prodaja/zakup čestica, komunalne naknade,
  # prostorni planovi, proračun, odluke vijeća i slične obavijesti općina i gradova
  - name: Općinske vijesti
    slug: opcinske-vijesti

# Serijali – tematske serije članaka koje idu uz mjesto i vrstu.
# Članak je u serijalu ako mu `categories` sadrži točan naziv, npr.
#   categories: [Fužine, Povijest, POVIJEST GK]
serijali:
  - name: POVIJEST GK
    slug: povijest-gk
    opis: Serijal o povijesti Gorskog kotara – mjesta, ljudi i priče iz prošlosti.

# Rubrika "Izdvojeno" na naslovnici: 1 udarna vijest + po jedna vijest iz svake grupe mjesta
# (svaka iz drugog mjesta). Udarna je najnoviji članak s `istaknuto: true` u front matteru,
# a ako takvog nema, najnoviji članak koji nije u heroju. Ako grupa nema članak, uzima se
# najnoviji članak iz nekog drugog, još neiskorištenog mjesta.
izdvojeno_grupe:
  - [Delnice]
  - [Fužine]
  - [Lokve, Čabar]
  - [Mrkopalj, Ravna Gora]
  - [Vrbovsko, Gorski kotar]
