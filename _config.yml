title: Gorski Kotar Info
description: "Vijesti iz Gorskog kotara: Delnice, Čabar, Vrbovsko, Fužine, Lokve, Mrkopalj, Ravna Gora, Skrad i Brod Moravice. Događanja, sport, promet, priroda i povijest."
tagline: Vijesti iz srca prirode
baseurl: "/gorski-kotar.info"
url: "https://mojgk.github.io"
theme: null
markdown: kramdown
permalink: /:title/
timezone: Europe/Zagreb

# Navigation
nav:
  - title: Početna
    url: /
  - title: Događaji
    url: /dogadaji/
  - title: Kalendar
    url: /kalendar/
  - title: Kategorije
    url: /kategorije/
  - title: Povijest
    url: /povijest/
  - title: Zaposlenje
    url: /zaposlenje/

# Author
author:
  name: Gorski Kotar Info
  bio: Gorski Kotar Info – vijesti iz srca prirode.


# Ankete (_includes/anketa.html): besplatni javni brojači bez prijave, s CORS-om.
# {kljuc} = <id ankete>-o<redni broj odgovora>. Ako glavni servis ne odgovori u timeout_ms,
# koristi se rezerva; ako ne rade oba, anketa ispiše poruku umjesto da šuti.
# timeout_ms vrijedi za sve servise; servis ga može nadjačati svojim timeout_ms.
ankete:
  timeout_ms: 4000
  servis:
    naziv: countapi
    get: "https://countapi.mileshilliard.com/api/v1/get/mojgk-{kljuc}"
    hit: "https://countapi.mileshilliard.com/api/v1/hit/mojgk-{kljuc}"
  rezerva:
    naziv: abacus
    get: "https://abacus.jasoncameron.dev/get/mojgk.github.io/{kljuc}"
    hit: "https://abacus.jasoncameron.dev/hit/mojgk.github.io/{kljuc}"
    timeout_ms: 8000   # Abacus je spor (5–8 s kad radi), pa mu treba dulji rok

# Kontakt za oglašavanje (placeholder bannera kad nema aktivnog oglasa); prazno = bez gumba
oglasi_kontakt: ""

# Brojač posjeta GoatCounter (_includes/goatcounter.html). Upiši kod računa, npr. goatcounter: mojgk
# (→ https://mojgk.goatcounter.com/count). Prazno = brojač isključen.
goatcounter: mojgk

# SEO, RSS i karta stranice (dodaci s popisa koje GitHub Pages podržava)
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
lang: hr_HR
logo: /assets/images/logo-gorski-kotar-info-512.png
feed:
  path: feed.xml
# Zadana slika za pregled pri dijeljenju (FB/WhatsApp) na stranicama koje nisu članci
defaults:
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/images/delnice-panorama-2024.jpg
