<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 272" width="240" height="272" role="img" aria-label="RG Liker – vučna služba · mehaničarska radnja">
  <rect x="4" y="4" width="232" height="264" rx="22" fill="#1f2a30"/>
  <rect x="12" y="12" width="216" height="248" rx="16" fill="none" stroke="#f58220" stroke-width="3"/>
  <!-- zupčanik -->
  <g transform="translate(120 82)">
