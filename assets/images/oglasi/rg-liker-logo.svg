      <circle r="44"/>
      <g id="z"><rect x="-9" y="-58" width="18" height="18" rx="3"/></g>
      <use href="#z" transform="rotate(45)"/><use href="#z" transform="rotate(90)"/><use href="#z" transform="rotate(135)"/>
      <use href="#z" transform="rotate(180)"/><use href="#z" transform="rotate(225)"/><use href="#z" transform="rotate(270)"/><use href="#z" transform="rotate(315)"/>
