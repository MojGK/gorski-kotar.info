<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="logo">
        <span class="logo-icon">🌲</span>
        <div>
          <a href="{{ '/' | relative_url }}" class="site-title">Moj Gorski Kotar</a>
          <p class="tagline">Osobni blog o ljepoti, životu i događajima našeg kraja</p>
        </div>
      </div>
      <nav>
        {% for item in site.nav %}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer>
    <div class="container">
      <p>&copy; {{ 'now' | date: '%Y' }} Moj Gorski Kotar · Osobni blog</p>
    </div>
  </footer>
</body>
</html>
